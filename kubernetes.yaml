          envFrom:
            - configMapRef:
                name: iep-config
            - secretRef:
                name: iep-secret
          env:
            - name: SERVICE_PORT
              value: "5002"
---
apiVersion: v1
kind: Service
metadata:
  name: director
spec:
  type: NodePort
  selector:
    app: director
  ports:
    - port: 5002
      nodePort: 30002

---
apiVersion: apps/v1
